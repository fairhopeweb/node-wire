<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" aria-labelledby="t d" role="img" viewBox="0 0 1080 360"><title id="t">Node Wire at a glance</title><desc id="d">A caller reaches a binding: REST, gRPC or MCP. The binding resolves the tenant, and ConnectorFactory resolves that tenant&apos;s named config and returns a tenant-pinned connector instance with its secrets, auth and policy. BaseConnector.run checks the tenant pin, then validates, applies scope policy, retries behind a circuit breaker and maps errors inside an OpenTelemetry span. The connector action calls the external API, and run returns the same ConnectorResponse through every transport. Traffic dots are blue for REST, amber for gRPC and teal for MCP; the returning response is grey.</desc><style>@keyframes hl{0%,22%{opacity:0}16%,4%{opacity:1}}@keyframes fadein{0%{opacity:0;transform:translateY(4px)}8%,82%{opacity:1;transform:none}92%{opacity:0}}@keyframes grow{0%{transform:scaleX(0)}70%,90%{transform:scaleX(1)}}text{font-family:Inter,&apos;SF Pro Text&apos;,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;fill:#111827}.t{font-size:13px;font-weight:600;letter-spacing:-.01em}.b{font-size:11.5px;fill:#6b7280}.k{font-size:10px;font-weight:600;fill:#9ca3af;letter-spacing:.08em}.m,.mi{font-family:&apos;JetBrains Mono&apos;,&apos;SF Mono&apos;,ui-monospace,Menlo,Consolas,monospace;font-size:11px;fill:#6b7280}.mi{fill:#111827}.ln{fill:none;stroke:#d1d5db;stroke-width:1}.route{offset-rotate:0deg;opacity:0}.hl{opacity:0;animation:hl var(--d, 6s) ease-in-out infinite;animation-delay:var(--w, 0s)}@media (prefers-reduced-motion:reduce){.hl,.route{animation:none!important;opacity:0}}</style><rect width="1080" height="360" fill="#fff" rx="12"/><rect width="1079" height="359" x=".5" y=".5" fill="none" stroke="#e5e7eb" rx="12"/><defs><marker id="a" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="7" refY="4" viewBox="0 0 8 8"><path fill="#d1d5db" d="M0 0 L8 4 L0 8 z"/></marker></defs><rect width="312" height="260" x="168" y="28" fill="#f9fafb" stroke="#e5e7eb" rx="10"/><text x="182" y="50" class="k" text-anchor="start">BINDINGS · LAYER C</text><rect width="248" height="260" x="504" y="28" fill="#f9fafb" stroke="#e5e7eb" rx="10"/><text x="518" y="50" class="k" text-anchor="start">RUNTIME · LAYER A</text><rect width="160" height="260" x="776" y="28" fill="#f9fafb" stroke="#e5e7eb" rx="10"/><text x="790" y="50" class="k" text-anchor="start">CONNECTORS · LAYER B</text><style>@keyframes r7{0%{offset-distance:0;opacity:0}1%,60.16%{opacity:1}61.16%{offset-distance:100%;opacity:0}}</style><circle r="3" fill="#1a9fc8" class="route" style="offset-path:path('M142 121 L 182 101 L 399 101 L 399 111 L 1008 111');animation:r7 6s linear 0s infinite"/><style>@keyframes r9{0%{offset-distance:0;opacity:0}1%,65.22%{opacity:1}66.22%{offset-distance:100%;opacity:0}}</style><circle r="3" fill="#c9971c" class="route" style="offset-path:path('M142 121 L 182 173 L 399 173 L 399 111 L 1008 111');animation:r9 6s linear 2s infinite"/><style>@keyframes r11{0%{offset-distance:0;opacity:0}1%,68.91%{opacity:1}69.91%{offset-distance:100%;opacity:0}}</style><circle r="3" fill="#12867a" class="route" style="offset-path:path('M142 221 L 182 245 L 399 245 L 399 111 L 1008 111');animation:r11 6s linear 4s infinite"/><style>@keyframes r13{0%{offset-distance:0;opacity:0}1%,44.21%{opacity:1}45.21%{offset-distance:100%;opacity:0}}</style><circle r="3" fill="#6b7280" class="route" style="offset-path:path('M628 288 L 628 320 L 83 320 L 83 246');animation:r13 6s linear 3.4s infinite"/><text x="24" y="50" class="k" text-anchor="start">CALLERS</text><rect width="118" height="50" x="24" y="96" fill="#fff" stroke="#e5e7eb" rx="7"/><text x="38" y="118" class="t" text-anchor="start">Apps</text><text x="38" y="134" class="b" text-anchor="start">services</text><rect width="118" height="50" x="24" y="196" fill="#fff" stroke="#e5e7eb" rx="7"/><text x="38" y="218" class="t" text-anchor="start">AI agents</text><text x="38" y="234" class="b" text-anchor="start">MCP clients</text><rect width="124" height="50" x="182" y="76" fill="#fff" stroke="#e5e7eb" rx="7"/><text x="196" y="98" class="t" text-anchor="start">REST</text><text x="196" y="114" class="b" text-anchor="start">tenant: header, JWT</text><circle cx="292" cy="92" r="3" fill="#1a9fc8"/><rect width="124" height="50" x="182" y="148" fill="#fff" stroke="#e5e7eb" rx="7"/><text x="196" y="170" class="t" text-anchor="start">gRPC</text><text x="196" y="186" class="b" text-anchor="start">tenant: metadata</text><circle cx="292" cy="164" r="3" fill="#c9971c"/><rect width="124" height="50" x="182" y="220" fill="#fff" stroke="#e5e7eb" rx="7"/><text x="196" y="242" class="t" text-anchor="start">MCP</text><text x="196" y="258" class="b" text-anchor="start">tenant: session</text><circle cx="292" cy="236" r="3" fill="#12867a"/><rect width="146" height="194" x="326" y="76" fill="#fff" stroke="#e5e7eb" rx="7"/><text x="340" y="100" class="mi" text-anchor="start">invoke.py</text><text x="340" y="120" class="t" text-anchor="start">ConnectorFactory</text><text x="340" y="146" class="m" text-anchor="start">get(tenant, config)</text><text x="340" y="164" class="b" text-anchor="start">named config</text><text x="340" y="182" class="b" text-anchor="start">secrets · auth</text><text x="340" y="200" class="b" text-anchor="start">PolicyHook</text><text x="340" y="218" class="b" text-anchor="start">→ pinned instance</text><text x="518" y="82" class="mi" text-anchor="start">BaseConnector.run()</text><rect width="220" height="28" x="518" y="94" fill="#fff" stroke="#e5e7eb" rx="7"/><g class="hl" style="--d:7s;--w:0.9s"><rect width="220" height="28" x="518" y="94" fill="#e8f6fb" stroke="#1a9fc8" stroke-opacity=".5" rx="7"/></g><text x="530" y="112" fill="#111827" class="b" text-anchor="start">Tenant pin check</text><path d="M524 142 L 518 142 L 518 278 L 524 278" class="ln"/><text x="530" y="146" class="k" text-anchor="start">OpenTelemetry span</text><rect width="208" height="26" x="530" y="156" fill="#fff" stroke="#e5e7eb" rx="7"/><g class="hl" style="--d:7s;--w:1.3s"><rect width="208" height="26" x="530" y="156" fill="#e8f6fb" stroke="#1a9fc8" stroke-opacity=".5" rx="7"/></g><text x="542" y="173" fill="#111827" class="b" text-anchor="start">Validation</text><rect width="208" height="26" x="530" y="187" fill="#fff" stroke="#e5e7eb" rx="7"/><g class="hl" style="--d:7s;--w:1.7000000000000002s"><rect width="208" height="26" x="530" y="187" fill="#e8f6fb" stroke="#1a9fc8" stroke-opacity=".5" rx="7"/></g><text x="542" y="204" fill="#111827" class="b" text-anchor="start">Scope policy</text><rect width="208" height="26" x="530" y="218" fill="#fff" stroke="#e5e7eb" rx="7"/><g class="hl" style="--d:7s;--w:2.1s"><rect width="208" height="26" x="530" y="218" fill="#e8f6fb" stroke="#1a9fc8" stroke-opacity=".5" rx="7"/></g><text x="542" y="235" fill="#111827" class="b" text-anchor="start">Retries · breaker</text><rect width="208" height="26" x="530" y="249" fill="#fff" stroke="#e5e7eb" rx="7"/><g class="hl" style="--d:7s;--w:2.5s"><rect width="208" height="26" x="530" y="249" fill="#e8f6fb" stroke="#1a9fc8" stroke-opacity=".5" rx="7"/></g><text x="542" y="266" fill="#111827" class="b" text-anchor="start">Error mapping</text><rect width="132" height="194" x="790" y="76" fill="#fff" stroke="#e5e7eb" rx="7"/><g class="hl" style="--d:7s;--w:3.0s"><rect width="132" height="194" x="790" y="76" fill="#e8f6fb" stroke="#1a9fc8" stroke-opacity=".5" rx="7"/></g><text x="808" y="102" class="t" text-anchor="start">Connector</text><text x="808" y="120" class="m" text-anchor="start">@nw_action</text><text x="808" y="156" class="t" text-anchor="start">Generated</text><text x="808" y="174" class="m" text-anchor="start">nw gen-all</text><text x="808" y="190" class="b" text-anchor="start">from OpenAPI</text><text x="960" y="50" class="k" text-anchor="start">EXTERNAL</text><rect width="96" height="50" x="960" y="86" fill="#fff" stroke="#e5e7eb" rx="7"/><text x="974" y="108" class="t" text-anchor="start">APIs</text><text x="974" y="124" class="b" text-anchor="start">SaaS · FHIR</text><path marker-end="url(#a)" d="M142 121 L 182 101" class="ln"/><path marker-end="url(#a)" d="M142 121 L 182 173" class="ln"/><path marker-end="url(#a)" d="M142 221 L 182 245" class="ln"/><path marker-end="url(#a)" d="M306 101 L 326 101" class="ln"/><path marker-end="url(#a)" d="M306 173 L 326 173" class="ln"/><path marker-end="url(#a)" d="M306 245 L 326 245" class="ln"/><path marker-end="url(#a)" d="M472 111 L 518 111" class="ln"/><path marker-end="url(#a)" d="M738 111 L 790 111" class="ln"/><path marker-end="url(#a)" d="M922 111 L 960 111" class="ln"/><path marker-end="url(#a)" d="M628 288 L 628 320 L 83 320 L 83 246" class="ln"/><text x="360" y="340" class="m" text-anchor="middle">ConnectorResponse · same envelope on every transport</text></svg>