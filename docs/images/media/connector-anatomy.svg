<svg xmlns="http://www.w3.org/2000/svg" width="960" height="270" aria-labelledby="t d" role="img" viewBox="0 0 960 270"><title id="t">Anatomy of a connector</title><desc id="d">A connector package holds schema.py with Pydantic models keyed by an action field, and logic.py with a BaseConnector subclass whose @nw_action methods call the external system. auto_register loads it through the node_wire.connectors entry point, which also registers its error_map. Each action then becomes a REST route, an MCP tool and a gRPC Invoke call.</desc><style>@keyframes hl{0%,22%{opacity:0}16%,4%{opacity:1}}@keyframes fadein{0%{opacity:0;transform:translateY(4px)}8%,82%{opacity:1;transform:none}92%{opacity:0}}@keyframes grow{0%{transform:scaleX(0)}70%,90%{transform:scaleX(1)}}text{font-family:Inter,&apos;SF Pro Text&apos;,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;fill:#111827}.t{font-size:13px;font-weight:600;letter-spacing:-.01em}.b{font-size:11.5px;fill:#6b7280}.k{font-size:10px;font-weight:600;fill:#9ca3af;letter-spacing:.08em}.m,.mi{font-family:&apos;JetBrains Mono&apos;,&apos;SF Mono&apos;,ui-monospace,Menlo,Consolas,monospace;font-size:11px;fill:#6b7280}.mi{fill:#111827}.ln{fill:none;stroke:#d1d5db;stroke-width:1}.route{offset-rotate:0deg;opacity:0}.hl{opacity:0;animation:hl var(--d, 6s) ease-in-out infinite;animation-delay:var(--w, 0s)}@media (prefers-reduced-motion:reduce){.hl,.route{animation:none!important;opacity:0}}</style><rect width="960" height="270" fill="#fff" rx="12"/><rect width="959" height="269" x=".5" y=".5" fill="none" stroke="#e5e7eb" rx="12"/><path d="M372 150 L 440 150" class="ln"/><path d="M630 150 C 675 150, 675 81, 720 81" class="ln"/><style>@keyframes r2{0%{offset-distance:0;opacity:0}1%,32.48%{opacity:1}33.48%{offset-distance:100%;opacity:0}}</style><circle r="3" fill="#1a9fc8" class="route" style="offset-path:path('M372 150 L 535 150 L 630 150 C 675 150, 675 81, 720 81 L 825 81');animation:r2 6s linear 0s infinite"/><path d="M630 150 C 675 150, 675 145, 720 145" class="ln"/><style>@keyframes r5{0%{offset-distance:0;opacity:0}1%,30.47%{opacity:1}31.47%{offset-distance:100%;opacity:0}}</style><circle r="3" fill="#c9971c" class="route" style="offset-path:path('M372 150 L 535 150 L 630 150 C 675 150, 675 145, 720 145 L 825 145');animation:r5 6s linear 2s infinite"/><path d="M630 150 C 675 150, 675 209, 720 209" class="ln"/><style>@keyframes r8{0%{offset-distance:0;opacity:0}1%,32.01%{opacity:1}33.01%{offset-distance:100%;opacity:0}}</style><circle r="3" fill="#12867a" class="route" style="offset-path:path('M372 150 L 535 150 L 630 150 C 675 150, 675 209, 720 209 L 825 209');animation:r8 6s linear 4s infinite"/><text x="32" y="40" class="k" text-anchor="start">PACKAGE</text><text x="32" y="62" class="mi" text-anchor="start">src/node_wire_&lt;id&gt;/</text><rect width="340" height="72" x="32" y="76" fill="#fff" stroke="#e5e7eb" rx="7"/><g class="hl" style="--d:6s;--w:0s"><rect width="340" height="72" x="32" y="76" fill="#e8f6fb" stroke="#1a9fc8" stroke-opacity=".5" rx="7"/></g><text x="46" y="98" class="t" text-anchor="start">schema.py</text><text x="46" y="118" class="m" xml:space="preserve">class SendInput(BaseModel):</text><text x="46" y="134" class="m" xml:space="preserve">action: Literal[&quot;send&quot;] = &quot;send&quot;</text><rect width="340" height="72" x="32" y="158" fill="#fff" stroke="#e5e7eb" rx="7"/><g class="hl" style="--d:6s;--w:1.2s"><rect width="340" height="72" x="32" y="158" fill="#e8f6fb" stroke="#1a9fc8" stroke-opacity=".5" rx="7"/></g><text x="46" y="180" class="t" text-anchor="start">logic.py</text><text x="46" y="200" class="m" xml:space="preserve">@nw_action(&quot;send&quot;)</text><text x="46" y="216" class="m" xml:space="preserve">async def send(self, params, *, trace_id)</text><text x="32" y="252" class="b" text-anchor="start">Optional: action_spec.py · normalizers.py · error_map</text><text x="440" y="40" class="k" text-anchor="start">REGISTER</text><rect width="190" height="76" x="440" y="112" fill="#f9fafb" stroke="#d1d5db" rx="7"/><text x="456" y="138" class="mi" text-anchor="start">auto_register()</text><text x="456" y="156" class="b" text-anchor="start">entry point node_wire.connectors</text><text x="456" y="172" class="b" text-anchor="start">registry + scoped error_map</text><text x="720" y="40" class="k" text-anchor="start">EXPOSED AS</text><rect width="210" height="50" x="720" y="56" fill="#fff" stroke="#e5e7eb" rx="7"/><text x="734" y="78" class="t" text-anchor="start">REST route</text><text x="734" y="94" class="m" text-anchor="start">POST /connectors/&lt;id&gt;/send</text><circle cx="916" cy="72" r="3" fill="#1a9fc8"/><rect width="210" height="50" x="720" y="120" fill="#fff" stroke="#e5e7eb" rx="7"/><text x="734" y="142" class="t" text-anchor="start">gRPC Invoke</text><text x="734" y="158" class="m" text-anchor="start">action: &quot;send&quot;</text><circle cx="916" cy="136" r="3" fill="#c9971c"/><rect width="210" height="50" x="720" y="184" fill="#fff" stroke="#e5e7eb" rx="7"/><text x="734" y="206" class="t" text-anchor="start">MCP tool</text><text x="734" y="222" class="m" text-anchor="start">&lt;id&gt;_send</text><circle cx="916" cy="200" r="3" fill="#12867a"/></svg>