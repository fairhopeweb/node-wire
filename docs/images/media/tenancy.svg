<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" aria-labelledby="t d" role="img" viewBox="0 0 960 250"><title id="t">Tenant-pinned connectors</title><desc id="d">Requests from tenants acme and globex reach ConnectorFactory, which resolves each tenant&apos;s own config and secrets from the config store and returns an instance pinned to that tenant. A tenant with no config, initech, is refused.</desc><style>@keyframes hl{0%,22%{opacity:0}16%,4%{opacity:1}}@keyframes fadein{0%{opacity:0;transform:translateY(4px)}8%,82%{opacity:1;transform:none}92%{opacity:0}}@keyframes grow{0%{transform:scaleX(0)}70%,90%{transform:scaleX(1)}}text{font-family:Inter,&apos;SF Pro Text&apos;,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;fill:#111827}.t{font-size:13px;font-weight:600;letter-spacing:-.01em}.b{font-size:11.5px;fill:#6b7280}.k{font-size:10px;font-weight:600;fill:#9ca3af;letter-spacing:.08em}.m{font-family:&apos;JetBrains Mono&apos;,&apos;SF Mono&apos;,ui-monospace,Menlo,Consolas,monospace;font-size:11px;fill:#6b7280}.er,.ln{fill:none;stroke-width:1}.ln{stroke:#d1d5db}.er{stroke:#e01d5a;stroke-opacity:.45}.route{offset-rotate:0deg;opacity:0}@media (prefers-reduced-motion:reduce){.route{animation:none!important;opacity:0}}</style><rect width="960" height="250" fill="#fff" rx="12"/><rect width="959" height="249" x=".5" y=".5" fill="none" stroke="#e5e7eb" rx="12"/><path d="M220 81 C 305 81, 305 125, 390 125" class="ln"/><path d="M220 145 C 305 145, 305 125, 390 125" class="ln"/><path d="M220 209 C 305 209, 305 125, 390 125" class="ln"/><path d="M570 125 C 655 125, 655 81, 740 81" class="ln"/><path d="M570 125 L 740 145" class="ln"/><path d="M570 125 C 655 125, 655 209, 740 209" class="er"/><path d="M480 154 L 480 184" class="ln"/><style>@keyframes r7{0%{offset-distance:0;opacity:0}1%,49.04%{opacity:1}50.04%{offset-distance:100%;opacity:0}}</style><circle r="3" fill="#1a9fc8" class="route" style="offset-path:path('M130 81 L 220 81 C 305 81, 305 125, 390 125 L 570 125 C 655 125, 655 81, 740 81 L 835 81');animation:r7 6s linear 0s infinite"/><style>@keyframes r9{0%{offset-distance:0;opacity:0}1%,48.15%{opacity:1}49.15%{offset-distance:100%;opacity:0}}</style><circle r="3" fill="#1a9fc8" class="route" style="offset-path:path('M130 145 L 220 145 C 305 145, 305 125, 390 125 L 570 125 L 740 145 L 835 145');animation:r9 6s linear 2s infinite"/><style>@keyframes r11{0%{offset-distance:0;opacity:0}1%,51.55%{opacity:1}52.55%{offset-distance:100%;opacity:0}}</style><circle r="3" fill="#e01d5a" class="route" style="offset-path:path('M130 209 L 220 209 C 305 209, 305 125, 390 125 L 570 125 C 655 125, 655 209, 740 209 L 835 209');animation:r11 6s linear 4s infinite"/><text x="40" y="40" class="k" text-anchor="start">CALLERS</text><rect width="180" height="50" x="40" y="56" fill="#fff" stroke="#e5e7eb" rx="7"/><text x="54" y="78" class="t" text-anchor="start">acme</text><text x="54" y="94" class="b" text-anchor="start">X-Tenant-ID header</text><rect width="180" height="50" x="40" y="120" fill="#fff" stroke="#e5e7eb" rx="7"/><text x="54" y="142" class="t" text-anchor="start">globex</text><text x="54" y="158" class="b" text-anchor="start">JWT tenant claim</text><rect width="180" height="50" x="40" y="184" fill="#fff" stroke="#e5e7eb" rx="7"/><text x="54" y="206" class="t" text-anchor="start">initech</text><text x="54" y="222" class="b" text-anchor="start">no config</text><text x="390" y="40" class="k" text-anchor="start">RESOLVE</text><rect width="180" height="58" x="390" y="96" fill="#f9fafb" stroke="#d1d5db" rx="7"/><text x="404" y="122" class="t" text-anchor="start">ConnectorFactory</text><text x="404" y="138" class="m" text-anchor="start">get(id, tenant_id)</text><rect width="160" height="50" x="400" y="184" fill="#fff" stroke="#e5e7eb" rx="7"/><text x="414" y="206" class="t" text-anchor="start">Config store</text><text x="414" y="222" class="b" text-anchor="start">configs · secrets</text><text x="740" y="40" class=