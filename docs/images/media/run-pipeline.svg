<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" aria-labelledby="t d" role="img" viewBox="0 0 960 250"><title id="t">The run() pipeline</title><desc id="d">Every action runs the tenant pin check, Pydantic validation, the PolicyHook, retries with a circuit breaker, then the connector&apos;s internal_execute. A failure at any step goes to the ErrorMapper. Both paths end in one ConnectorResponse. Everything after the tenant check runs inside an OpenTelemetry span.</desc><style>@keyframes hl{0%,22%{opacity:0}16%,4%{opacity:1}}@keyframes fadein{0%{opacity:0;transform:translateY(4px)}8%,82%{opacity:1;transform:none}92%{opacity:0}}@keyframes grow{0%{transform:scaleX(0)}70%,90%{transform:scaleX(1)}}text{font-family:Inter,&apos;SF Pro Text&apos;,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;fill:#111827}.t{font-size:13px;font-weight:600;letter-spacing:-.01em}.b{font-size:11.5px;fill:#6b7280}.k{font-size:10px;font-weight:600;fill:#9ca3af;letter-spacing:.08em}.m,.mi{font-family:&apos;JetBrains Mono&apos;,&apos;SF Mono&apos;,ui-monospace,Menlo,Consolas,monospace;font-size:11px;fill:#6b7280}.mi{fill:#111827}.er,.ln{fill:none;stroke-width:1}.ln{stroke:#d1d5db}.er{stroke:#e01d5a;stroke-opacity:.45}.route{offset-rotate:0deg;opacity:0}.hl{opacity:0;animation:hl var(--d, 6s) ease-in-out infinite;animation-delay:var(--w, 0s)}@media (prefers-reduced-motion:reduce){.hl,.route{animation:none!important;opacity:0}}</style><rect width="960" height="250" fill="#fff" rx="12"/><rect width="959" height="249" x=".5" y=".5" fill="none" stroke="#e5e7eb" rx="12"/><text x="40" y="40" class="k" text-anchor="start">EVERY ACTION, EVERY TRANSPORT</text><path d="M244 64 L 244 58 L 770 58 L 770 64" class="ln"/><text x="507" y="52" class="k" text-anchor="middle">OpenTelemetry span</text><path d="M124 100 L 790 100" class="ln"/><path d="M194.0 124 L 194.0 176" class="er"/><path d="M312.0 124 L 312.0 176" class="er"/><path d="M430.0 124 L 430.0 176" class="er"/><path d="M564.0 124 L 564.0 176" class="er"/><path d="M711.0 124 L 711.0 176" class="er"/><path d="M770 196 L 860 196 L 860 120" class="er"/><style>@keyframes r10{0%{offset-distance:0;opacity:0}1%,45.55%{opacity:1}46.55%{offset-distance:100%;opacity:0}}</style><circle r="3" fill="#1a9fc8" class="route" style="offset-path:path('M78 100 L 860 100');animation:r10 7s linear 0s infinite"/><style>@keyframes r12{0%{offset-distance:0;opacity:0}1%,43.05%{opacity:1}44.05%{offset-distance:100%;opacity:0}}</style><circle r="3" fill="#e01d5a" class="route" style="offset-path:path('M312 100 L 312 196 L 860 196 L 860 100');animation:r12 7s linear 3.6s infinite"/><rect width="92" height="40" x="32" y="80" fill="#fff" stroke="#e5e7eb" rx="7"/><text x="78" y="104.5" class="mi" text-anchor="middle">run()</text><rect width="96" height="48" x="146" y="76" fill="#fff" stroke="#e5e7eb" rx="7"/><g class="hl" style="--d:7.0s;--w:0.13333333333333336s"><rect width="96" height="48" x="146" y="76" fill="#e8f6fb" stroke="#1a9fc8" stroke-opacity=".5" rx="7"/></g><text x="194" y="96" class="t" text-anchor="middle">Tenant</text><text x="194" y="112" class="b" text-anchor="middle">pin check</text><rect width="96" height="48" x="264" y="76" fill="#fff" stroke="#e5e7eb" rx="7"/><g class="hl" style="--d:7.0s;--w:0.625s"><rect width="96" height="48" x="264" y="76" fill="#e8f6fb" stroke="#1a9fc8" stroke-opacity=".5" rx="7"/></g><text x="312" y="96" class="t" text-anchor="middle">Validate</text><text x="312" y="112" class="b" text-anchor="middle">Pydantic</text><rect width="96" height="48" x="382" y="76" fill="#fff" stroke="#e5e7eb" rx="7"/><g class="hl" style="--d:7.0s;--w:1.1166666666666667s"><rect width="96" height="48" x="382" y="76" fill="#e8f6fb" stroke="#1a9fc8" stroke-opacity=".5" rx="7"/></g><text x="430" y="96" class="t" text-anchor="middle">Policy</text><text x="430" y="112" class="b" text-anchor="middle">PolicyHook</text><rect width="128" height="48" x="500" y="76" fill="#fff" stroke="#e5e7eb" rx="7"/><g class="hl" style="--d:7.0s;--w:1.6749999999999998s"><rect width="128" height="48" x="500" y="76" fill="#e8f6fb" stroke="#1a9fc8" stroke-opacity=".5" rx="7"/></g><text x="564" y="96" class="t" text-anchor="middle">Resilience</text><text x="564" y="112" class="b" text-anchor="middle">retries · breaker</text><rect width="118" height="48" x="652" y="76" fill="#fff" stroke="#e5e7eb" rx="7"/><g class="hl" style="--d:7.0s;--w:2.2875s"><rect width="118" height="48" x="652" y="76" fill="#e8f6fb" stroke="#1a9fc8" stroke-opacity=".5" rx="7"/></g><text x="711" y="96" class="t" text-anchor="middle">Execute</text><text x="711" y="112" class="b" text-anchor="middle">connector</text><rect width="140" height="40" x="790" y="80" fill="#fff" stroke="#e5e7eb" rx="7"/><text x="860" y="104.5" class="mi" text-anchor="middle">ConnectorResponse</text><rect width="610" height="40" x="160" y="176" fill="#fff" stroke="#e5e7eb" rx="7"/><text x="176" y="200" class="t" text-anchor="start">ErrorMapper</text><text x="270" y="200" class="m" text-anchor="start">stable error_code · RETRYABLE · BUSINESS · AUTH · FATAL</text></svg>