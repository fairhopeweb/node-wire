<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" aria-labelledby="t d" role="img" viewBox="0 0 960 220"><title id="t">The nw CLI pipeline</title><desc id="d">nw gen-all takes an OpenAPI or Swagger spec through four stages: connector codegen, wheel build, MCP host build and wiring into config. nw docker-build then builds a Docker image from the MCP host. gen-whl and gen-mcp run single stages; gen-stacklok builds a stacklok MCP server.</desc><style>@keyframes hl{0%,22%{opacity:0}16%,4%{opacity:1}}@keyframes fadein{0%{opacity:0;transform:translateY(4px)}8%,82%{opacity:1;transform:none}92%{opacity:0}}@keyframes grow{0%{transform:scaleX(0)}70%,90%{transform:scaleX(1)}}text{font-family:Inter,&apos;SF Pro Text&apos;,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;fill:#111827}.t{font-size:13px;font-weight:600;letter-spacing:-.01em}.b{font-size:11.5px;fill:#6b7280}.k{font-size:10px;font-weight:600;fill:#9ca3af;letter-spacing:.08em}.mi{font-family:&apos;JetBrains Mono&apos;,&apos;SF Mono&apos;,ui-monospace,Menlo,Consolas,monospace;font-size:11px;fill:#111827}.ln{fill:none;stroke:#d1d5db;stroke-width:1}.hl{opacity:0;animation:hl var(--d, 6s) ease-in-out infinite;animation-delay:var(--w, 0s)}.bar{transform-box:fill-box;transform-origin:left;animation:grow 8s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.hl{animation:none!important;opacity:0}.bar{animation:none;opacity:1}}</style><rect width="960" height="220" fill="#fff" rx="12"/><rect width="959" height="219" x=".5" y=".5" fill="none" stroke="#e5e7eb" rx="12"/><rect width="110" height="52" x="32" y="74" fill="#fff" stroke="#e5e7eb" rx="7"/><text x="87" y="97" class="t" text-anchor="middle">OpenAPI</text><text x="87" y="113" class="b" text-anchor="middle">path or URL</text><text x="176" y="46" class="mi" text-anchor="start">nw gen-all</text><path d="M176 56 L 770 56" class="ln"/><rect width="594" height="2" x="176" y="55" fill="#1a9fc8" class="bar"/><rect width="138" height="52" x="176" y="74" fill="#fff" stroke="#e5e7eb" rx="7"/><g class="hl" style="--d:8s;--w:0.2s"><rect width="138" height="52" x="176" y="74" fill="#e8f6fb" stroke="#1a9fc8" stroke-opacity=".5" rx="7"/></g><text x="245" y="97" class="t" text-anchor="middle">Codegen</text><text x="245" y="113" class="b" text-anchor="middle">schema · logic</text><rect width="138" height="52" x="328" y="74" fill="#fff" stroke="#e5e7eb" rx="7"/><g class="hl" style="--d:8s;--w:1.5999999999999999s"><rect width="138" height="52" x="328" y="74" fill="#e8f6fb" stroke="#1a9fc8" stroke-opacity=".5" rx="7"/></g><text x="397" y="97" class="t" text-anchor="middle">Wheels</text><text x="397" y="113" class="b" text-anchor="middle">build-packages.sh</text><rect width="138" height="52" x="480" y="74" fill="#fff" stroke="#e5e7eb" rx="7"/><g class="hl" style="--d:8s;--w:3.0s"><rect width="138" height="52" x="480" y="74" fill="#e8f6fb" stroke="#1a9fc8" stroke-opacity=".5" rx="7"/></g><text x="549" y="97" class="t" text-anchor="middle">MCP host</text><text x="549" y="113" class="b" text-anchor="middle">nw-mcp-builder</text><rect width="138" height="52" x="632" y="74" fill="#fff" stroke="#e5e7eb" rx="7"/><g class="hl" style="--d:8s;--w:4.3999999999999995s"><rect width="138" height="52" x="632" y="74" fill="#e8f6fb" stroke="#1a9fc8" stroke-opacity=".5" rx="7"/></g><text x="701" y="97" class="t" text-anchor="middle">Wire</text><text x="701" y="113" class="b" text-anchor="middle">connectors.yaml</text><path d="M142 100 L 176 100" class="ln"/><path d="M314 100 L 328 100" class="ln"/><path d="M466 100 L 480 100" class="ln"/><path d="M618 100 L 632 100" class="ln"/><path d="M770 100 L 800 100" class="ln"/><rect width="130" height="52" x="800" y="74" fill="#fff" stroke="#e5e7eb" rx="7"/><text x="865" y="97" class="mi" text-anchor="middle">nw docker-build</text><text x="865" y="113" class="b" text-anchor="middle">MCP server image</text><text x="176" y="162" class="k" text-anchor="start">SINGLE STAGES</text><rect width="138" height="30" x="328" y="150" fill="#fff" stroke="#e5e7eb" rx="7"/><text x="397" y="169.5" class="mi" text-anchor="middle">nw gen-whl</text><rect width="138" height="30" x="480" y="150" fill="#fff" stroke="#e5e7eb" rx="7"/><text x="549" y="169.5" class="mi" text-anchor="middle">nw gen-mcp</text><rect width="274" height="30" x="632" y="150" fill="#fff" stroke="#e5e7eb" rx="7"/><text x="769" y="169.5" class="mi" text-anchor="middle">nw gen-stacklok · curated tools</text><text x="480" y="204" class="b" text-anchor="middle">Each stage reports in a Rich progress view; a failure names the stage and the fix.</text></svg>